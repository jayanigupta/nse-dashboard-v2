name: Update Fundamentals

on:
  schedule:
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pandas requests lxml beautifulsoup4 playwright

          - name: Update Market Lens
            run: |
              DAY=$(( $(TZ=Asia/Kolkata date +%s) / 86400 ))

              if (( DAY % 2 == 0 )); then
                echo "Market Lens update day"
                python -m playwright install chromium
                python update_marketlens.py
              else
                echo "Skipping Market Lens update today"
              fi

    - name: Get Screener Fundamentals
      run: |
        python get_screener_data.py

    - name: Commit updated fundamentals
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        git add fundamentals.csv fundamentals.csv.backup marketlens.csv

        git commit -m "Update fundamentals data" || echo "No changes"

        git push
