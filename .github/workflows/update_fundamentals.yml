name: Update Fundamentals

on:
  schedule:
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml beautifulsoup4 playwright yfinance
          python -m pip show yfinance
          python -c "import yfinance; print('yfinance import successful:', yfinance.__version__)"
          python -m playwright install --with-deps chromium


      - name: Update Market Lens
        run: |
          DAY=$(( $(TZ=Asia/Kolkata date +%s) / 86400 ))

          if (( DAY % 2 == 0 )); then
            echo "Market Lens update day"
            python update_marketlens.py
          else
            echo "Skipping Market Lens update today"
          fi

      - name: Build Fundamentals
        run: python build_fundamentals.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add fundamentals.csv fundamentals.csv.backup marketlens.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Market Lens and fundamentals"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
