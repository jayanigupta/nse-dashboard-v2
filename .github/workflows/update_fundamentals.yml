name: Update Fundamentals

on:
  schedule:
    - cron: '30 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pandas requests lxml

    - name: Get Screener Fundamentals
      run: |
        python get_screener_data.py

    - name: Commit updated fundamentals
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        git add fundamentals.csv

        git commit -m "Weekly fundamentals update" || echo "No changes"

        git push
